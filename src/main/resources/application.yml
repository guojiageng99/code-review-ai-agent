spring:
  application:
    name: code-review-ai-agent
  datasource:
    url: jdbc:h2:mem:codeguardian
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
ai:
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-3.5-turbo}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
