<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Review - CodeGuardian AI</title><link rel="stylesheet" href="/css/review.css"></head><body><div class="review-container"><aside class="sidebar"><div class="logo">🛡️</div><a class="active" href="/review">⌕</a><a href="/admin/roles">⚙</a></aside><main class="main-content"><header class="top-header"><h1>Code Review</h1><div class="user-section"><span>CodeGuardian AI</span><a class="logout-btn" href="/auth/login">Logout</a></div></header><section class="content-area"><div class="editor-panel"><div class="editor-controls"><select id="reviewType"><option value="snippet">Snippet</option><option value="file">File</option><option value="directory">Directory</option><option value="project">Project</option></select><button id="startReview">Start review</button></div><p class="editor-hint">Paste code below or choose a review scope.</p><textarea id="codeEditor" class="code-editor" placeholder="Paste source code here..."></textarea></div><aside class="results-panel"><section class="results-section"><h2>Findings</h2><div id="results" class="results-content empty-state">No findings yet</div></section><section class="details-section"><h2>Details</h2><div id="details" class="details-content empty-state">Select a finding to inspect it</div></section></aside></section></main></div><script>document.getElementById('startReview').onclick=async()=>{const type=document.getElementById('reviewType').value;const code=document.getElementById('codeEditor').value;const r=await fetch('/api/review/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskName:'Web review',codeSnippet:code})});const data=await r.json();document.getElementById('results').textContent=data.message||'Review task created';};</script></body></html>
