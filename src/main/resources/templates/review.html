<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Review - CodeGuardian AI</title><link rel="stylesheet" href="/css/review.css"></head>
<body><div class="review-container"><aside class="sidebar"><div class="logo">CodeGuardian</div><a class="active" href="/review">Review</a><a href="/admin/roles">Roles</a></aside><main class="main-content"><header class="top-header"><h1>Code Review</h1><div class="user-section"><span>CodeGuardian AI</span><a class="logout-btn" href="/auth/login">Logout</a></div></header><section class="content-area"><div class="editor-panel"><div class="editor-controls"><select id="reviewType"><option value="snippet">Snippet</option><option value="file">File</option><option value="directory">Directory</option><option value="project">Project</option></select><select id="aiModel" disabled><option value="">Rules only (no model configured)</option></select><button id="startReview">Start review</button></div><p id="modelHint" class="editor-hint">Rule review is available without configuring an AI model.</p><textarea id="codeEditor" class="code-editor" placeholder="Paste source code here..."></textarea></div><aside class="results-panel"><section class="results-section"><h2>Findings</h2><div id="results" class="results-content empty-state">No findings yet</div></section><section class="details-section"><h2>Details</h2><div id="details" class="details-content empty-state">Select a finding to inspect it</div></section></aside></section></main></div>
<script>
const modelSelect=document.getElementById('aiModel');
fetch('/api/ai/models').then(r=>r.json()).then(models=>{if(models.length){modelSelect.disabled=false;modelSelect.innerHTML='<option value="">Rules only</option>'+models.map(m=>'<option value="'+m.provider+'">'+m.provider+(m.model?' ('+m.model+')':'')+'</option>').join('');document.getElementById('modelHint').textContent='Choose Rules only or one of the configured AI models.';}}).catch(()=>{});
document.getElementById('startReview').onclick=async()=>{const type=document.getElementById('reviewType').value;const code=document.getElementById('codeEditor').value;const r=await fetch('/api/review/'+type,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({taskName:'Web review',codeSnippet:code})});const data=await r.json();document.getElementById('results').textContent=data.message||'Review task created';};
</script></body></html>
