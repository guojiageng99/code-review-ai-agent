<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - CodeGuardian AI</title><link rel="stylesheet" th:href="@{/css/login.css}"></head><body><main class="login-container"><section class="login-panel"><div class="logo-section"><div class="logo-icon">🛡️</div><h1>CodeGuardian AI</h1><p class="subtitle">Intelligent code review system</p></div><form th:action="@{/auth/login}" method="post" class="login-form"><div th:if="${error}" class="error-message" th:text="${error}"></div><div th:if="${message}" class="success-message" th:text="${message}"></div><div class="form-group"><label for="usernameOrEmail">Username or email</label><input id="usernameOrEmail" name="usernameOrEmail" required autofocus></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" name="password" required></div><button type="submit" class="login-button">Login</button></form><p class="login-hint">Default account: <strong>admin</strong> / <strong>admin123</strong></p></section></main></body></html>
